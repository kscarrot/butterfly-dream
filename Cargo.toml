[workspace]
resolver = "2"
members = [
    "crates/doc-core",
    "crates/doc-lsp",
    "crates/doc-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
doc-core = { path = "crates/doc-core" }
markdown = { version = "1.0.0", features = ["serde"] }
toml = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-lsp = "0.20.0"
tokio = { version = "1.54.1", features = ["full"] }
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
